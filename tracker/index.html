                                  <div className="flex items-center gap-2 flex-1">
                                    <div className="flex flex-col gap-1">
                                      <button
                                        onClick={() => moveObjectUp(puzzle.id, objIdx)}
                                        disabled={objIdx === 0}
                                        className={`p-0.5 rounded ${objIdx === 0 ? 'text-gray-600 cursor-not-allowed' : 'text-blue-300 hover:bg-blue-600/20'} transition-all`}
                                        title="Move up"
                                      >
                                        <ChevronUp size={12} />
                                      </button>
                                      <button
                                        onClick={() => moveObjectDown(puzzle.id, objIdx)}
                                        disabled={objIdx === (puzzle.objects || []).length - 1}
                                        className={`p-0.5 rounded ${objIdx === (puzzle.objects || []).length - 1 ? 'text-gray-600 cursor-not-allowed' : 'text-blue-300 hover:bg-blue-600/20'} transition-all`}
                                        title="Move down"
                                      >
                                        <ChevronDown size={12} />
                                      </button>
                                    </div>
                                    <div className="flex-1">
                                      <span className="text-blue-300 font-mono text-sm mr-3">Object {objIdx + 1}:</span>
                                      <span className="text-white">{obj.name}</span>
                                      {!obj.enabled && <span className="text-red-400 ml-3 text-sm">(Disabled)</span>}
                                    </div>
                                  </div>
                                  <div className="flex gap-1">
                                    <button
                                      onClick={() => toggleObject(puzzle.id, obj.id)}
                                      className={`px-2 py-1 rounded text-xs font-medium transition-all ${
                                        obj.enabled
                                          ? 'bg-red-600/20 text-red-400 hover:bg-red-600/30'
                                          : 'bg-green-600/20 text-green-400 hover:bg-green-600/30'
                                      }`}
                                    >
                                      {obj.enabled ? 'Disable' : 'Enable'}
                                    </button>
                                    <button
                                      onClick={() => deleteObject(puzzle.id, obj.id)}
                                      className="px-2 py-1 bg-red-600/20 text-red-400 rounded text-xs hover:bg-red-600/30 transition-all"
                                    >
                                      <Trash2 size={14} />
                                    </button>
                                  </div>
                                </div>
                              ))}
                              {(!puzzle.objects || puzzle.objects.length === 0) && (
                                <p className="text-blue-300 text-sm italic">No objects yet</p>
                              )}
                            </div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {showWarning && (
                <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
                  <div className="bg-slate-800 rounded-2xl p-8 max-w-md border border-red-500/50 shadow-2xl">
                    <div className="flex items-center gap-3 mb-4">
                      <AlertTriangle className="text-red-400" size={32} />
                      <h3 className="text-2xl font-bold text-white">Warning</h3>
                    </div>
                    <p className="text-orange-200 mb-6">{showWarning.message}</p>
                    <div className="flex gap-4">
                      <button
                        onClick={() => setShowWarning(null)}
                        className="flex-1 bg-slate-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-slate-500 transition-all"
                      >
                        Cancel
                      </button>
                      <button
                        onClick={confirmDisableHint}
                        className="flex-1 bg-red-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-red-500 transition-all"
                      >
                        Disable
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        return (
          <div className="min-h-screen bg-gradient-to-br from-black via-gray-950 to-black p-8">
            <div className="max-w-4xl mx-auto">
              <button
                onClick={() => window.location.href = '/'}
                className="mb-6 text-orange-200 hover:text-purple-100 flex items-center gap-2 transition-colors"
              >
                <ChevronLeft size={20} />
                Back to Home
              </button>

              <h2 className="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-400 mb-8">
                Game Configuration
              </h2>

              {/* How Did You Hear Settings */}
              <div className="bg-slate-700/80 backdrop-blur-lg rounded-2xl p-6 border border-orange-500/50 shadow-xl mb-6">
                <h3 className="text-xl font-bold text-white mb-4">📋 "How Did You Hear" Data Source</h3>
                <p className="text-orange-200 text-sm mb-4">
                  Pull options from your Google Sheet. Format: Tab Name, Column, Start Row. This list feeds the "How did you hear about us?" dropdown shown on the Pre-Game screen for every room.
                </p>
                <div className="grid grid-cols-3 gap-4 mb-4">
                  <div>
                    <label className="block text-orange-200 text-xs mb-2 font-semibold" title="Tab in the Google Sheet holding the list of 'how did you hear' options, one per row.">Tab Name</label>
                    <input
                      type="text"
                      value={howDidYouConfig.tab}
                      onChange={(e) => setHowDidYouConfig(prev => ({ ...prev, tab: e.target.value }))}
                      placeholder="e.g., HOW DID YOU?"
                      title="Exact tab name, case-sensitive."
                      className="w-full bg-slate-600/90 text-white p-3 rounded-xl border border-orange-400/60 focus:border-orange-400 focus:outline-none text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-orange-200 text-xs mb-2 font-semibold" title="Spreadsheet column letter that contains the option text.">Column</label>
                    <input
                      type="text"
                      value={howDidYouConfig.column}
                      onChange={(e) => setHowDidYouConfig(prev => ({ ...prev, column: e.target.value.toUpperCase() }))}
                      placeholder="e.g., B"
                      maxLength="2"
                      title="Single column letter, e.g. 'B'."
                      className="w-full bg-slate-600/90 text-white p-3 rounded-xl border border-orange-400/60 focus:border-orange-400 focus:outline-none text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-orange-200 text-xs mb-2 font-semibold" title="First row to read — skip header rows above your options.">Start Row</label>
                    <input
                      type="number"
                      value={howDidYouConfig.startRow}
                      onChange={(e) => setHowDidYouConfig(prev => ({ ...prev, startRow: e.target.value }))}
                      placeholder="e.g., 3"
                      min="1"
                      title="Row number where the actual option values start (rows above this are skipped, e.g. headers)."
                      className="w-full bg-slate-600/90 text-white p-3 rounded-xl border border-orange-400/60 focus:border-orange-400 focus:outline-none text-sm"
                    />
                  </div>
                </div>
                <button
                  onClick={saveHowDidYouConfig}
                  title="Persists this configuration on the server (data/storage.json) for all game masters."
                  className="w-full bg-gradient-to-r from-green-600 to-emerald-600 text-white p-3 rounded-xl font-bold hover:from-green-500 hover:to-emerald-500 transition-all text-sm"
                >
                  Save Configuration
                </button>
              </div>

              <button
                onClick={startNewGame}
                className="w-full bg-gradient-to-r from-orange-600 to-amber-600 text-white p-6 rounded-2xl font-bold text-lg flex items-center justify-center gap-3 hover:from-orange-500 hover:to-amber-500 transition-all shadow-lg mb-6"
              >
                <Plus size={24} />
                Create New Game
              </button>

              <div className="space-y-4">
                {games.map(game => (
                  <div
                    key={game.id}
                    className="bg-slate-700/80 backdrop-blur-lg p-6 rounded-2xl border border-orange-500/50 hover:border-orange-400/50 transition-all shadow-xl"
                  >
                    <div className="flex items-center justify-between">
                      <div>
                        <h3 className="text-2xl font-bold text-white mb-1">{game.name}</h3>
                        <p className="text-orange-300 text-sm">{game.puzzles.length} puzzles</p>
                      </div>
                      <div className="flex gap-2">
                        <button
                          onClick={() => editGame(game)}
                          className="px-6 py-3 bg-orange-600 text-white rounded-xl font-bold hover:bg-orange-500 transition-all"
                        >
                          Edit
                        </button>
                        <button
                          onClick={() => deleteGame(game.id)}
                          className="px-6 py-3 bg-red-600/20 text-red-400 rounded-xl font-bold hover:bg-red-600/30 transition-all"
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      };

      // Pre-Game Screen Component - Collect info before starting
      const PreGameScreen = React.memo(() => {
        const [howDidYouOptions, setHowDidYouOptions] = useState([]);
        const [scheduledTimes, setScheduledTimes] = useState([]);
        // Local state to avoid triggering parent re-renders on every keystroke
        const [formData, setFormData] = useState({
          gameMaster: gameSession.gameMaster || '',
          scheduledTime: gameSession.scheduledTime || '',
          actualStartTime: '',
          experienced: gameSession.experienced || 0,
          newPlayers: gameSession.newPlayers || 0,
          howDidYouHear: gameSession.howDidYouHear || '',
          isOtherSelected: gameSession.isOtherSelected || false,
          notes: gameSession.notes || ''
        });

        useEffect(() => {
          loadHowDidYouOptions();
          loadScheduledTimes();
        }, []);

        const loadHowDidYouOptions = async () => {
          try {
            const configData = await window.storage.get('howDidYouConfig');
            if (configData) {
              const config = JSON.parse(configData.value);
              const response = await fetch('/api/sheets/how-did-you-hear', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
              });
              if (response.ok) {
                const data = await response.json();
                setHowDidYouOptions(data.options || []);
              }
            }
          } catch (error) {
            console.log('Could not load How Did You Hear options:', error);
          }
        };

        const loadScheduledTimes = async () => {
          if (!selectedGame.scheduleTab || !selectedGame.gamePrefix) {
            console.log('No schedule tab or prefix configured for this game');
            return;
          }

          try {
            const response = await fetch('/api/sheets/scheduled-times', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                scheduleTab: selectedGame.scheduleTab,
                gamePrefix: selectedGame.gamePrefix
              })
            });
            if (response.ok) {
              const data = await response.json();
              setScheduledTimes(data.times || []);
              console.log(`Loaded ${data.times?.length || 0} scheduled times for today`);
            }
          } catch (error) {
            console.log('Could not load scheduled times:', error);
          }
        };

        const handleStartGame = () => {
          // Validate required fields
          if (!formData.gameMaster) {
            alert('Please select a Game Master');
            return;
          }
          if (scheduledTimes.length > 0 && !formData.scheduledTime) {
            alert('Please select a Scheduled Time');
            return;
          }
          
          // Capture actual start time
          const actualStartTime = new Date().toISOString();
          
          // Save all form data to gameSession including actual start time
          setGameSession(prev => ({
            ...prev,
            ...formData,
            actualStartTime: actualStartTime,
            dateTime: formData.scheduledTime || actualStartTime // Use scheduled time or actual time
          }));
          setCurrentScreen('game');
        };

        const enabledGameMasters = gameMasters.filter(m => m.enabled);

        return (
          <div className="min-h-screen bg-gradient-to-br from-black via-gray-950 to-black p-8">
            <div className="max-w-4xl mx-auto">
              <button
                onClick={() => {
                  setCurrentScreen('main');
                  setGameSession(null);
                  setSelectedGame(null);
                }}
                className="mb-6 text-orange-200 hover:text-purple-100 flex items-center gap-2 transition-colors"
              >
                ← Back to Main Menu
              </button>

              <div className="bg-slate-800/50 backdrop-blur-lg rounded-2xl p-8 border border-orange-500/20 shadow-2xl">
                <h1 className="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-400 mb-2">
                  {selectedGame?.name}
                </h1>
                <h2 className="text-2xl text-orange-200 mb-8">Pre-Game Setup</h2>

                <div className="space-y-6">
                  {/* Game Master */}
                  <div>
                    <label className="block text-orange-200 text-sm mb-2 font-semibold">Game Master *</label>
                    <select
                      value={formData.gameMaster}
                      onChange={(e) => setFormData(prev => ({ ...prev, gameMaster: e.target.value }))}
                      className="w-full bg-slate-600/90 text-white p-4 rounded-xl border border-orange-400/60 focus:border-orange-400 focus:outline-none"
                    >
                      <option value="">-- Select Game Master --</option>
                      {enabledGameMasters.map(master => (
                        <option key={master.id} value={master.name}>{master.name}</option>
                      ))}
                    </select>
                  </div>

                  {/* Scheduled Time */}
                  <div>
                    <label className="block text-orange-200 text-sm mb-2 font-semibold">
                      Scheduled Time - {new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                    </label>
                    {scheduledTimes.length > 0 ? (
                      <select
                        value={formData.scheduledTime}
                        onChange={(e) => setFormData(prev => ({ ...prev, scheduledTime: e.target.value }))}
                        className="w-full bg-slate-600/90 text-white p-4 rounded-xl border border-orange-400/60 focus:border-orange-400 focus:outline-none"
                      >
                        <option value="">-- Select Scheduled Time --</option>
                        {scheduledTimes.map((time, idx) => (
                          <option key={idx} value={time}>
                            {time}
                          </option>
                        ))}
                      </select>
                    ) : (
                      <div className="bg-slate-600/90 text-gray-400 p-4 rounded-xl border border-orange-400/60">
                        {selectedGame.scheduleTab && selectedGame.gamePrefix 
                          ? 'No scheduled times found' 
                          : 'No schedule configured (set Schedule Tab & Prefix in Game Configuration)'}
                      </div>
                    )}
                  </div>

                  {/* Players */}
                  <div className="bg-slate-600/80 rounded-xl p-6 border border-orange-500/50">
                    <div className="text-orange-200 text-sm font-semibold mb-4 text-center">PLAYERS</div>
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-orange-200 text-xs mb-2">Experienced</label>
                        <div className="flex gap-2">
                          <button
                            onClick={() => setFormData(prev => ({ ...prev, experienced: Math.max(0, prev.experienced - 1) }))}
                            className="bg-slate-700 text-white px-4 py-3 rounded-lg font-bold hover:bg-slate-600"
                          >
                            -
                          </button>
                          <div className="flex-1 bg-slate-700 text-white text-center py-3 rounded-lg font-bold text-2xl">
                            {formData.experienced}
                          </div>
                          <button
                            onClick={() => setFormData(prev => ({ ...prev, experienced: prev.experienced + 1 }))}
                            className="bg-blue-600 text-white px-4 py-3 rounded-lg font-bold hover:bg-blue-500"
                          >
                            +
                          </button>
                        </div>
                      </div>
                      <div>
                        <label className="block text-orange-200 text-xs mb-2">New Players</label>
                        <div className="flex gap-2">
                          <button
                            onClick={() => setFormData(prev => ({ ...prev, newPlayers: Math.max(0, prev.newPlayers - 1) }))}
                            className="bg-slate-700 text-white px-4 py-3 rounded-lg font-bold hover:bg-slate-600"
                          >
                            -
                          </button>
                          <div className="flex-1 bg-slate-700 text-white text-center py-3 rounded-lg font-bold text-2xl">
                            {formData.newPlayers}
                          </div>
                          <button
                            onClick={() => setFormData(prev => ({ ...prev, newPlayers: prev.newPlayers + 1 }))}
                            className="bg-green-600 text-white px-4 py-3 rounded-lg font-bold hover:bg-green-500"
                          >
                            +
                          </button>
                        </div>
                      </div>
                    </div>
                    <div className="mt-4 text-center text-orange-200 font-bold text-xl">
                      Total: {formData.experienced + formData.newPlayers}
                    </div>
                  </div>

                  {/* How Did You Hear */}
                  <div>
                    <label className="block text-orange-200 text-sm mb-2 font-semibold">How did you hear about us?</label>
                    {howDidYouOptions.length === 0 ? (
                      <input
                        type="text"
                        value={formData.howDidYouHear}
                        onChange={(e) => setFormData(prev => ({ ...prev, howDidYouHear: e.target.value }))}
                        placeholder="Type here..."
                        className="w-full bg-slate-600/90 text-white p-4 rounded-xl border border-orange-400/60 focus:border-orange-400 focus:outline-none"
                      />
                    ) : (
                      <>
                        <select
                          value={formData.isOtherSelected ? 'Other' : formData.howDidYouHear}
                          onChange={(e) => {
                            if (e.target.value === 'Other') {
                              setFormData(prev => ({ ...prev, isOtherSelected: true, howDidYouHear: '' }));
                            } else {
                              setFormData(prev => ({ ...prev, isOtherSelected: false, howDidYouHear: e.target.value }));
                            }
                          }}
                          className="w-full bg-slate-600/90 text-white p-4 rounded-xl border border-orange-400/60 focus:border-orange-400 focus:outline-none"
                        >
                          <option value="">-- Select --</option>
                          {howDidYouOptions.map(option => (
                            <option key={option} value={option}>{option}</option>
                          ))}
                          <option value="Other">💬 Other</option>
                        </select>
                        {formData.isOtherSelected && (
                          <input
                            type="text"
                            value={formData.howDidYouHear}
                            onChange={(e) => setFormData(prev => ({ ...prev, howDidYouHear: e.target.value }))}
                            placeholder="Please specify..."
                            className="w-full bg-slate-600/90 text-white p-4 rounded-xl border border-orange-400/60 focus:border-orange-400 focus:outline-none mt-2"
                          />
                        )}
                      </>
                    )}
                  </div>

                  {/* Notes */}
                  <div>
                    <label className="block text-orange-200 text-sm mb-2 font-semibold">Notes</label>
                    <textarea
                      value={formData.notes}
                      onChange={(e) => setFormData(prev => ({ ...prev, notes: e.target.value }))}
                      rows="4"
                      placeholder="Any additional notes..."
                      className="w-full bg-slate-600/90 text-white p-4 rounded-xl border border-orange-400/60 focus:border-orange-400 focus:outline-none resize-none"
                    />
                  </div>

                  {/* Start Button */}
                  <button
                    onClick={handleStartGame}
                    className="w-full bg-gradient-to-r from-orange-600 to-amber-600 text-white p-6 rounded-xl font-bold text-xl hover:from-orange-500 hover:to-amber-500 transition-all shadow-lg"
                  >
                    Start Game →
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      });

      // Game Screen Component
      const GameScreen = () => {
        const [startTime, setStartTime] = useState(null);
        const [howDidYouOptions, setHowDidYouOptions] = useState([]);

        useEffect(() => {
          // Sync startTime from gameSession
          if (gameSession?.startTime) {
            setStartTime(gameSession.startTime);
          }
        }, [gameSession?.startTime]);

        useEffect(() => {
          // Load How Did You Hear options
          loadHowDidYouOptions();
        }, []);

        const loadHowDidYouOptions = async () => {
          try {
            const configData = await window.storage.get('howDidYouConfig');
            if (configData) {
              const config = JSON.parse(configData.value);
              const response = await fetch('/api/sheets/how-did-you-hear', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
              });
              if (response.ok) {
                const data = await response.json();
                setHowDidYouOptions(data.options || []);
                console.log('Loaded How Did You Hear options:', data.options);
              }
            }
          } catch (error) {
            console.log('Could not load How Did You Hear options:', error);
          }
        };

        const handleStart = async () => {
          const now = Date.now();
          setStartTime(now);
          const sessionId = `session-${Date.now()}`;
          
          // Sync to Google Sheets and get row index
          const rowIndex = await syncToSheets('start', {
            sessionId,
            gameName: selectedGame.name,
            sheetTab: selectedGame.sheetTab,
            gameMaster: gameSession.gameMaster,
            date: new Date().toLocaleDateString('en-US'),
            startTime: new Date(now).toLocaleTimeString('en-US', { hour12: false }),
            newPlayers: gameSession.newPlayers,
            experienced: gameSession.experienced
          });

          setGameSession(prev => ({
            ...prev,
            startTime: now,
            sessionId: sessionId,
            sheetRowIndex: rowIndex
          }));
        };

        const syncToSheets = async (action, data) => {
          try {
            const endpoint = action === 'start' ? '/api/sheets/start-session' :
                           action === 'update' ? '/api/sheets/update-session' :
                           '/api/sheets/complete-session';
            
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            });
            
            if (response.ok) {
              const result = await response.json();
              return result.rowIndex; // Return row index for start action
            }
          } catch (error) {
            console.error('Error syncing to Google Sheets:', error);
          }
          return null;
        };

        const handleDateButton = () => {
          const now = new Date().toISOString().slice(0, 16);
          setGameSession(prev => ({ ...prev, dateTime: now }));
        };

        const formatTime = (seconds) => {
          const hrs = Math.floor(seconds / 3600);
          const mins = Math.floor((seconds % 3600) / 60);
          const secs = seconds % 60;
          return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        };

        const incrementExperienced = () => {
          setGameSession(prev => ({ ...prev, experienced: prev.experienced + 1 }));
        };

        const incrementNew = () => {
          setGameSession(prev => ({ ...prev, newPlayers: prev.newPlayers + 1 }));
        };

        const addPuzzleHint = (puzzleIndex) => {
          setGameSession(prev => ({
            ...prev,
            puzzles: prev.puzzles.map((p, i) =>
              i === puzzleIndex ? { ...p, hintCount: p.hintCount + 1 } : p
            )
          }));
        };

        const updatePuzzleHintCount = (puzzleIndex, value) => {
          const count = Math.max(0, parseInt(value) || 0);
          setGameSession(prev => ({
            ...prev,
            puzzles: prev.puzzles.map((p, i) =>
              i === puzzleIndex ? { ...p, hintCount: count } : p
            )
          }));
        };

        const markPuzzleSolved = (puzzleIndex) => {
          const puzzle = gameSession.puzzles[puzzleIndex];
          
          if (!puzzle.solved) {
            // Solving the puzzle
            if (!gameSession.startTime) return;
            
            const solvedTime = Date.now();
            const duration = formatDuration(solvedTime - gameSession.startTime);
            
            setGameSession(prev => ({
              ...prev,
              puzzles: prev.puzzles.map((p, i) =>
                i === puzzleIndex ? { ...p, solved: true, solvedTime, duration } : p
              )
            }));
          } else {
            // Unsolving the puzzle
            setGameSession(prev => ({
              ...prev,
              puzzles: prev.puzzles.map((p, i) =>
                i === puzzleIndex ? { ...p, solved: false, solvedTime: null } : p
              )
            }));
          }
        };

        const updatePuzzleDuration = (puzzleIndex, value) => {
          setGameSession(prev => ({
            ...prev,
            puzzles: prev.puzzles.map((p, i) =>
              i === puzzleIndex ? { ...p, duration: value } : p
            )
          }));
        };

        const adjustDuration = (puzzleIndex, seconds) => {
          const puzzle = gameSession.puzzles[puzzleIndex];
          const parts = puzzle.duration.split(':');
          let totalSeconds = parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(parts[2]);
          totalSeconds = Math.max(0, totalSeconds + seconds);
          
          const hours = Math.floor(totalSeconds / 3600);
          const minutes = Math.floor((totalSeconds % 3600) / 60);
          const secs = totalSeconds % 60;
          const newDuration = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
          
          updatePuzzleDuration(puzzleIndex, newDuration);
        };

        const updateStartTime = (newTime) => {
          const now = new Date(newTime).getTime();
          setStartTime(now);
          setGameSession(prev => ({ ...prev, startTime: now }));
        };

        const adjustStartTime = (seconds) => {
          if (!gameSession.startTime) return;
          const newStartTime = gameSession.startTime + (seconds * 1000);
          setStartTime(newStartTime);
          setGameSession(prev => ({ ...prev, startTime: newStartTime }));
        };

        const formatDuration = (ms) => {
          const totalSeconds = Math.floor(ms / 1000);
          const hours = Math.floor(totalSeconds / 3600);
          const minutes = Math.floor((totalSeconds % 3600) / 60);
          const seconds = totalSeconds % 60;
          return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        };

        const getTotalHints = () => {
          return gameSession.puzzles.reduce((sum, p) => sum + p.hintCount, 0) + gameSession.otherHints;
        };

        const incrementOtherHints = () => {
          setGameSession(prev => ({ ...prev, otherHints: prev.otherHints + 1 }));
        };

        const decrementOtherHints = () => {
          const puzzleHintsTotal = gameSession.puzzles.reduce((sum, p) => sum + p.hintCount, 0);
          const totalHints = getTotalHints();
          if (totalHints > puzzleHintsTotal) {
            setGameSession(prev => ({ ...prev, otherHints: prev.otherHints - 1 }));
          }
        };

        const toggleObjectFound = (puzzleIndex, objectId) => {
          const puzzle = gameSession.puzzles[puzzleIndex];
          const foundIndex = puzzle.foundObjects.findIndex(f => f.objectId === objectId);
          
          if (foundIndex >= 0) {
            // Remove from found objects
            setGameSession(prev => ({
              ...prev,
              puzzles: prev.puzzles.map((p, i) =>
                i === puzzleIndex
                  ? { ...p, foundObjects: p.foundObjects.filter(f => f.objectId !== objectId) }
                  : p
              )
            }));
          } else {
            // Add to found objects with timestamp
            setGameSession(prev => ({
              ...prev,
              puzzles: prev.puzzles.map((p, i) =>
                i === puzzleIndex
                  ? { ...p, foundObjects: [...p.foundObjects, { objectId, timestamp: Date.now() }] }
                  : p
              )
            }));
          }
        };

        const handleClear = () => {
          setStartTime(null);
          setGameSession({
            ...gameSession,
            startTime: null,
            gameMaster: '',
            experienced: 0,
            newPlayers: 0,
            dateTime: '',
            puzzles: selectedGame.puzzles.map(p => ({
              ...p,
              hintCount: 0,
              solved: false,
              solvedTime: null,
              duration: '00:00:00',
              foundObjects: []
            })),
            otherHints: 0
          });
        };

        const handleSubmit = async () => {
          try {
            // Sync final data to Google Sheets
            if (gameSession.sheetRowIndex && startTime) {
              const elapsed = formatTime(Math.floor((Date.now() - startTime) / 1000));
              await syncToSheets('complete', {
                rowIndex: gameSession.sheetRowIndex,
                sheetTab: selectedGame.sheetTab,
                gameMaster: gameSession.gameMaster,
                date: new Date(gameSession.dateTime).toLocaleDateString('en-US'),
                startTime: new Date(startTime).toLocaleTimeString('en-US', { hour12: false }),
                totalHints: getTotalHints(),
                elapsedTime: elapsed,
                newPlayers: gameSession.newPlayers,
                experienced: gameSession.experienced,
                notes: gameSession.notes,
                howDidYouHear: gameSession.howDidYouHear
              });
            }

            // Reset form (keep selectedGame reference)
            setStartTime(null);
            setGameSession({
              gameMaster: '',
              dateTime: new Date().toISOString().slice(0, 16),
              experienced: 0,
              newPlayers: 0,
              totalHints: 0,
              otherHints: 0,
              notes: '',
              howDidYouHear: '',
              isOtherSelected: false,
              puzzles: (selectedGame?.puzzles || []).map(p => ({
                id: p.id,
                name: p.name,
                hintCount: 0,
                solved: false,
                duration: p.duration,
                foundObjects: []
              })),
              sessionId: null,
              sheetRowIndex: null,
              startTime: null
            });

            alert('Session saved successfully!');
          } catch (error) {
            console.error('Error saving session:', error);
            alert('Error saving session to Google Sheets.');
          }
        };

        const groupSize = gameSession.experienced + gameSession.newPlayers;
        const enabledGameMasters = gameMasters.filter(m => m.enabled);

        return (
          <div className="min-h-screen bg-gradient-to-br from-black via-gray-950 to-black p-8">
            <div className="max-w-7xl mx-auto">
              <button
                onClick={() => window.location.href = '/'}
                className="mb-6 text-orange-200 hover:text-purple-100 flex items-center gap-2 transition-colors"
              >
                <ChevronLeft size={20} />
                Back to Home
              </button>

              <h2 className="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-400 mb-8">
                {selectedGame.name}
              </h2>

              {/* Control Panel */}
              <div className="bg-slate-700/70 backdrop-blur-lg rounded-2xl p-6 border border-orange-400/60 shadow-2xl mb-8">
                <div className="grid grid-cols-2 gap-6">
                  
                  {/* Left Column - Game Info & Controls */}
                  <div className="space-y-4">
                    {!startTime ? (
                      <button
                        onClick={handleStart}
                        className="w-full bg-gradient-to-r from-green-600 to-emerald-600 text-white p-6 rounded-xl font-bold text-lg flex items-center justify-center gap-2 hover:from-green-500 hover:to-emerald-500 transition-all shadow-lg"
                      >
                        <Clock size={24} />
                        Start
                      </button>
                    ) : (
                      <div className="bg-slate-700/80 backdrop-blur-lg rounded-xl border border-orange-500/50 p-4">
                        <div className="text-orange-200 text-sm font-semibold mb-2 text-center">GAME RUNNING</div>
                        <div className="flex items-center gap-2">
                          <div className="flex flex-col gap-1">
                            <button
                              onClick={() => adjustStartTime(1)}
                              onMouseDown={(e) => {
                                const interval = setInterval(() => adjustStartTime(10), 200);
                                e.target.dataset.interval = interval;
                              }}
                              onMouseUp={(e) => clearInterval(e.target.dataset.interval)}
                              onMouseLeave={(e) => clearInterval(e.target.dataset.interval)}
                              className="bg-blue-600 text-white px-2 py-1 rounded hover:bg-blue-500 transition-all text-xs"
                            >
                              ▲
                            </button>
                            <button
                              onClick={() => adjustStartTime(-1)}
                              onMouseDown={(e) => {
                                const interval = setInterval(() => adjustStartTime(-10), 200);
                                e.target.dataset.interval = interval;
                              }}
                              onMouseUp={(e) => clearInterval(e.target.dataset.interval)}
                              onMouseLeave={(e) => clearInterval(e.target.dataset.interval)}
                              className="bg-blue-600 text-white px-2 py-1 rounded hover:bg-blue-500 transition-all text-xs"
                            >
                              ▼
                            </button>
                          </div>
                          <input
                            type="text"
                            value={new Date(startTime).toLocaleTimeString('en-US', { hour12: false })}
                            onChange={(e) => {
                              const timeStr = e.target.value;
                              const parts = timeStr.split(':');
                              if (parts.length === 3) {
                                const now = new Date(startTime);
                                now.setHours(parseInt(parts[0]) || 0);
                                now.setMinutes(parseInt(parts[1]) || 0);
                                now.setSeconds(parseInt(parts[2]) || 0);
                                updateStartTime(now.toISOString().slice(0, 16));
                              }
                            }}
                            placeholder="HH:MM:SS"
                            className="flex-1 bg-slate-600/90 text-white p-3 rounded-lg border border-orange-400/60 focus:border-orange-400 focus:outline-none text-center font-bold font-mono"
                          />
                        </div>
                      </div>
                    )}

                    {startTime && (
                      <div className="grid grid-cols-2 gap-4">
                        <button
                          onClick={() => {
                            setGameSession(prev => ({ ...prev, gameResult: 'win', endTime: Date.now() }));
                            setCurrentScreen('postgame');
                          }}
                          className="bg-gradient-to-r from-green-600 to-emerald-600 text-white p-6 rounded-xl font-bold text-lg flex items-center justify-center gap-2 hover:from-green-500 hover:to-emerald-500 transition-all shadow-lg"
                        >
                          🏆 Win
                        </button>
                        <button
                          onClick={() => {
                            setGameSession(prev => ({ ...prev, gameResult: 'lose', endTime: Date.now() }));
                            setCurrentScreen('postgame');
                          }}
                          className="bg-gradient-to-r from-red-600 to-rose-600 text-white p-6 rounded-xl font-bold text-lg flex items-center justify-center gap-2 hover:from-red-500 hover:to-rose-500 transition-all shadow-lg"
                        >
                          ❌ Lose
                        </button>
                      </div>
                    )}
                  </div>

                  {/* Right Column - Notes */}
                  <div>
                    {/* Notes */}
                    <div>
                      <label className="block text-orange-200 text-sm mb-2 font-semibold">Notes (editable during game)</label>
                      <textarea
                        value={gameSession.notes}
                        onChange={(e) => setGameSession(prev => ({ ...prev, notes: e.target.value }))}
                        className="w-full bg-slate-600/90 text-white p-4 rounded-xl border border-orange-400/60 focus:border-orange-400 focus:outline-none resize-y min-h-[400px]"
                        placeholder="Add any notes about this session..."
                      />
                    </div>

                  </div>
                </div>
              </div>

              {/* Dividing Line */}
              <div className="relative mb-8">
                <div className="absolute inset-0 flex items-center">
                  <div className="w-full border-t-2 border-orange-400/60"></div>
                </div>
                <div className="relative flex justify-center">
                  <span className="bg-gradient-to-br from-black via-gray-950 to-black px-6 py-2 text-orange-200 font-bold text-sm rounded-full border border-orange-400/60">
                    PUZZLES
                  </span>
                </div>
              </div>

              {/* Row 4 - Headers */}
              <div className="grid gap-2 md:gap-4 mb-4" style={{ gridTemplateColumns: 'auto auto 60px 1fr 1fr auto auto' }}>
                <div></div>
                <div className="bg-gray-900/50 p-2 md:p-4 rounded-xl border border-orange-400/60 text-center">
                  <span className="text-orange-200 font-bold text-xs md:text-base">Puzzle</span>
                </div>
                <div className="bg-gray-900/50 p-2 md:p-4 rounded-xl border border-orange-400/60 text-center">
                  <span className="text-orange-200 font-bold text-xs md:text-base">Hints</span>
                </div>
                <div className="bg-gray-900/50 p-2 md:p-4 rounded-xl border border-orange-400/60 text-center">
                  <span className="text-orange-200 font-bold text-xs md:text-base">Hint List</span>
                </div>
                <div className="bg-gray-900/50 p-2 md:p-4 rounded-xl border border-orange-400/60 text-center">
                  <span className="text-orange-200 font-bold text-xs md:text-base">Objects</span>
                </div>
                <div className="bg-gray-900/50 p-2 md:p-4 rounded-xl border border-orange-400/60 text-center">
                  <span className="text-orange-200 font-bold text-xs md:text-base">Solve</span>
                </div>
                <div className="bg-gray-900/50 p-2 md:p-4 rounded-xl border border-orange-400/60 text-center">
                  <span className="text-orange-200 font-bold text-xs md:text-base">Solved</span>
                </div>
              </div>

              {/* Puzzle Rows */}
              {gameSession.puzzles.map((puzzle, index) => {
                const enabledHints = puzzle.hints.filter(h => h.enabled);
                const enabledObjects = (puzzle.objects || []).filter(obj => obj.enabled);
                
                return (
                  <div key={puzzle.id} className="grid gap-2 md:gap-4 mb-4" style={{ gridTemplateColumns: 'auto auto 60px 1fr 1fr auto auto' }}>
                    <button
                      onClick={() => addPuzzleHint(index)}
                      className="bg-gradient-to-r from-amber-600 to-orange-600 text-white p-6 rounded-xl font-bold text-lg hover:from-amber-500 hover:to-orange-500 transition-all shadow-lg"
                    >
                      Hint
                    </button>
                    <div className="bg-slate-700/80 backdrop-blur-lg p-4 rounded-xl border border-orange-500/50 flex items-center">
                      <span className="text-white font-semibold text-sm md:text-base">{puzzle.name}</span>
                    </div>
                    <input
                      type="number"
                      value={puzzle.hintCount}
                      onChange={(e) => updatePuzzleHintCount(index, e.target.value)}
                      className="bg-slate-600/90 text-white p-2 md:p-4 rounded-xl border border-orange-400/60 focus:border-orange-400 focus:outline-none text-center text-lg md:text-xl font-bold w-full"
                      style={{ maxWidth: '60px' }}
                      min="0"
                    />
                    <div className="bg-slate-700/80 backdrop-blur-lg p-2 md:p-4 rounded-xl border border-orange-500/50">
                      {enabledHints.map((hint, hintIdx) => (
                        <div key={hint.id} className="text-orange-200 text-xs md:text-sm mb-1 md:mb-2">
                          <span className="text-orange-300 font-mono mr-1 md:mr-2">{hintIdx + 1}.</span>
                          {hint.text}
                        </div>
                      ))}
                      {enabledHints.length === 0 && (
                        <span className="text-orange-300 text-xs md:text-sm italic">No hints</span>
                      )}
                    </div>
                    <div className="bg-slate-700/80 backdrop-blur-lg p-2 md:p-4 rounded-xl border border-blue-400/50">
                      {enabledObjects.length > 0 ? (
                        <div className="space-y-1">
                          {enabledObjects.map(obj => {
                            const isFound = puzzle.foundObjects.some(f => f.objectId === obj.id);
                            return (
                              <label key={obj.id} className="flex items-center gap-2 text-sm cursor-pointer hover:bg-slate-600/80 p-1 rounded">
                                <input
                                  type="checkbox"
                                  checked={isFound}
                                  onChange={() => toggleObjectFound(index, obj.id)}
                                  className="w-4 h-4 rounded border-blue-500"
                                />
                                <span className={isFound ? 'text-green-400 font-semibold' : 'text-blue-200'}>{obj.name}</span>
                              </label>
                            );
                          })}
                        </div>
                      ) : (
                        <span className="text-blue-300 text-sm italic">No objects</span>
                      )}
                    </div>
                    <button
                      onClick={() => markPuzzleSolved(index)}
                      className={`rounded-xl font-bold transition-all shadow-lg flex items-center justify-center gap-2 p-6 text-lg ${
                        puzzle.solved
                          ? 'bg-green-600 text-white hover:bg-green-700'
                          : 'bg-slate-700 text-white hover:bg-slate-600'
                      }`}
                    >
                      {puzzle.solved && <Check size={24} />}
                      {puzzle.solved ? 'Solved' : 'Solve'}
                    </button>
                    <div className="bg-slate-700/80 backdrop-blur-lg rounded-xl border border-orange-500/50 p-2">
                      {puzzle.solved && puzzle.solvedTime ? (
                        <div className="flex flex-col items-center justify-center h-full gap-1">
                          <div className="text-orange-200 text-xs">Time Solved</div>
                          <div className="text-white text-lg font-mono font-bold">
                            {new Date(puzzle.solvedTime).toLocaleTimeString('en-US', { hour12: false })}
                          </div>
                          <div className="text-orange-200 text-xs mt-1">Duration</div>
                          <div className="flex items-center gap-1 w-full">
                            <div className="flex flex-col gap-1">
                              <button
                                onClick={() => adjustDuration(index, 1)}
                                onMouseDown={(e) => {
                                  const interval = setInterval(() => adjustDuration(index, 10), 200);
                                  e.target.dataset.interval = interval;
                                }}
                                onMouseUp={(e) => clearInterval(e.target.dataset.interval)}
                                onMouseLeave={(e) => clearInterval(e.target.dataset.interval)}
                                className="bg-blue-600 text-white px-1.5 py-0.5 rounded hover:bg-blue-500 transition-all text-xs"
                                title="Click: +1s | Hold: +10s"
                              >
                                ▲
                              </button>
                              <button
                                onClick={() => adjustDuration(index, -1)}
                                onMouseDown={(e) => {
                                  const interval = setInterval(() => adjustDuration(index, -10), 200);
                                  e.target.dataset.interval = interval;
                                }}
                                onMouseUp={(e) => clearInterval(e.target.dataset.interval)}
                                onMouseLeave={(e) => clearInterval(e.target.dataset.interval)}
                                className="bg-blue-600 text-white px-1.5 py-0.5 rounded hover:bg-blue-500 transition-all text-xs"
                                title="Click: -1s | Hold: -10s"
                              >
                                ▼
                              </button>
                            </div>
                            <input
                              type="text"
                              value={puzzle.duration}
                              onChange={(e) => updatePuzzleDuration(index, e.target.value)}
                              className="flex-1 bg-slate-600/90 text-white p-1.5 rounded-lg border border-orange-400/60 focus:border-orange-400 focus:outline-none text-center text-base font-mono font-bold min-w-0"
                              placeholder="HH:MM:SS"
                            />
                          </div>
                        </div>
                      ) : (
                        <div className="flex items-center justify-center h-full text-orange-300 text-sm italic">
                          Not solved yet
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      };

      // Render appropriate screen
      return (
        <>
          {currentScreen === 'main' && <MainMenu />}
          {currentScreen === 'gameConfig' && <GameConfig />}
          {currentScreen === 'pregame' && <PreGameScreen />}
          {currentScreen === 'game' && <GameScreen />}
          {currentScreen === 'postgame' && <PostGameScreen />}
        </>
      );
    };

    ReactDOM.render(<EscapeRoomTracker />, document.getElementById('root'));
  </script>
</body>
</html>
