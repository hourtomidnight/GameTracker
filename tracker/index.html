<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hour to Midnight - Tracker</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script>
    // Check authentication on page load
    (async function() {
      try {
        const response = await fetch('/api/auth/check');
        const data = await response.json();
        if (!data.authenticated) {
          window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname);
        }
      } catch (error) {
        window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname);
      }
    })();

    // Storage API wrapper
    window.storage = {
      async get(key) {
        try {
          const response = await fetch(`/api/storage/${key}`);
          if (response.status === 401) {
            window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname);
            return null;
          }
          if (response.ok) {
            return await response.json();
          }
          throw new Error('Not found');
        } catch (e) {
          throw e;
        }
      },
      async set(key, value) {
        const response = await fetch(`/api/storage/${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value })
        });
        if (response.status === 401) {
          window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname);
          return null;
        }
        return await response.json();
      },
      async delete(key) {
        const response = await fetch(`/api/storage/${key}`, {
          method: 'DELETE'
        });
        if (response.status === 401) {
          window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname);
          return null;
        }
        return await response.json();
      },
      async list(prefix) {
        return { keys: [] };
      }
    };
  </script>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    // Simple Icon Components
    const Plus = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    );
    
    const Play = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

      </svg>
    );
    
    const Settings = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="3"></circle>

        <path d="M17.196 3.804l-4.243 4.243m0 6.364l4.243 4.243"></path>

    );
    
    const Users = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>

    const Clock = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    );
    
    const Check = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>

    const X = ({ size = 24, className = "" }) => (

        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    );
    
    const AlertTriangle = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    );
    
    const Download = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
    );
    
    const ChevronLeft = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    );
    
    const Trash2 = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
    );

    const ChevronUp = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    );

    const ChevronDown = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    );

    const EscapeRoomTracker = () => {
      const [currentScreen, setCurrentScreen] = useState('main');
      const [games, setGames] = useState([]);
      const [gameMasters, setGameMasters] = useState([]);
      const [selectedGame, setSelectedGame] = useState(null);
      const [gameSession, setGameSession] = useState(null);
      const [showWarning, setShowWarning] = useState(null);

      useEffect(() => {
        loadData();
      }, []);

      const loadData = async () => {
        // Load games
        try {
          const gamesData = await window.storage.get('games');
          if (gamesData) {
            const parsedGames = JSON.parse(gamesData.value);
            console.log('Loaded games:', parsedGames);
            setGames(parsedGames);
          } else {
            console.log('No games found');
          }
        } catch (error) {
          console.log('No games in storage yet');
        }
        
        // Load game masters from the shared "Drop Down options" sheet tab
        // (same source RoomReset uses for its operator list)
        try {
          const response = await fetch('/api/sheets/how-did-you-hear', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tab: 'Drop Down options', column: 'B', startRow: 1 })
          });
          const data = await response.json();
          const names = (data.options || []).slice().sort((a, b) => a.localeCompare(b));
          setGameMasters(names.map(name => ({ id: name, name, enabled: true })));
        } catch (error) {
          console.log('Failed to load game masters from sheet:', error);
        }
      };

      const saveGames = async (gamesData) => {
        setGames(gamesData);
        await window.storage.set('games', JSON.stringify(gamesData));
      };

      // Main Menu Component
      const MainMenu = () => {
        const [selectedGameId, setSelectedGameId] = useState('');

        const handleStartGame = () => {
          if (!selectedGameId) return;
          const game = games.find(g => g.id === selectedGameId);
          setSelectedGame(game);
          setGameSession({
            gameId: game.id,
            gameName: game.name,
            sessionId: null,
            sheetRowIndex: null,
            startTime: null,
            endTime: null,
            gameResult: null, // 'win' or 'lose'
            gameMaster: '',
            experienced: 0,
            newPlayers: 0,
            dateTime: new Date().toISOString().slice(0, 16),
            notes: '',
            howDidYouHear: '',
            isOtherSelected: false,
            puzzles: game.puzzles.map(p => ({
              ...p,
              hintCount: 0,
              solved: false,
              solvedTime: null,
              duration: '00:00:00',
              foundObjects: [] // Track which objects were found with timestamps
            })),
            otherHints: 0,
            totalHints: 0
          });
          setCurrentScreen('pregame'); // Changed from 'game' to 'pregame'
        };

        return (
          <div className="min-h-screen bg-gradient-to-br from-black via-gray-950 to-black p-8">
            <div className="max-w-4xl mx-auto">
              <button
                onClick={() => window.location.href = '/'}
                className="mb-6 text-orange-200 hover:text-purple-100 flex items-center gap-2 transition-colors"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                Back to Home
              </button>
              
              <div className="text-center mb-12">
                <div className="flex justify-center mb-6">
                  <img src="https://www.hourtomidnight.com/wp-content/uploads/2025/02/57bdd921036be9b815b12c40_Logo-Horiz-White-Text.webp" alt="Hour to Midnight" className="h-20" onError={(e) => e.target.style.display='none'} />
                </div>
                <h1 className="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-400 mb-4">
                  Session Tracker
                </h1>
                <p className="text-orange-200 text-lg">Manage your escape room sessions and track player progress</p>
              </div>

              <div className="bg-slate-700/80 backdrop-blur-lg rounded-2xl p-8 border border-orange-500/50 shadow-2xl mb-6">
                <label className="block text-orange-200 text-lg mb-4 font-semibold">Select Game</label>
                <select
                  value={selectedGameId}
                  onChange={(e) => setSelectedGameId(e.target.value)}
                  className="w-full bg-slate-600/90 text-white p-4 rounded-xl border border-orange-400/60 focus:border-orange-400 focus:outline-none text-lg"
                >
                  <option value="">-- Choose a game --</option>
                  {games.map(game => (
                    <option key={game.id} value={game.id}>{game.name}</option>
                  ))}
                </select>
                
                <button
                  onClick={handleStartGame}
                  disabled={!selectedGameId}
                  className="w-full mt-6 bg-gradient-to-r from-orange-600 to-amber-600 text-white p-4 rounded-xl font-bold text-lg flex items-center justify-center gap-3 hover:from-orange-500 hover:to-amber-500 transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-lg"
                >
                  <Play size={24} />
                  Start Game
                </button>
              </div>

              <div className="grid grid-cols-1 gap-6">
                <button
                  onClick={() => setCurrentScreen('gameConfig')}
                  className="bg-slate-700/80 backdrop-blur-lg p-8 rounded-2xl border border-orange-500/50 hover:border-orange-400/50 transition-all shadow-xl flex items-center gap-4 text-white"
                >
                  <Settings size={32} className="text-amber-400" />
                  <div className="text-left">
                    <div className="font-bold text-xl">Game Configuration</div>
                    <div className="text-orange-200 text-sm">Add or edit games and puzzles</div>
                  </div>
                </button>
              </div>
            </div>
          </div>
        );
      };
      // Game Config Component
      const GameConfig = () => {
        const [editingGame, setEditingGame] = useState(null);
        const [gameName, setGameName] = useState('');
        const [sheetTab, setSheetTab] = useState('');
        const [scheduleTab, setScheduleTab] = useState('');
        const [gamePrefix, setGamePrefix] = useState('');
        const [availableTabs, setAvailableTabs] = useState([]);
        const [puzzles, setPuzzles] = useState([]);
        const [newPuzzleName, setNewPuzzleName] = useState('');
        const [editingPuzzle, setEditingPuzzle] = useState(null);
        const [newHint, setNewHint] = useState('');
        const [editingObjects, setEditingObjects] = useState(null);
        const [newObject, setNewObject] = useState('');
        const [howDidYouConfig, setHowDidYouConfig] = useState({
          tab: 'HOW DID YOU?',
          column: 'B',
          startRow: '3'
        });

        // Fetch available sheet tabs and howDidYou config on component mount
        useEffect(() => {
          fetchSheetTabs();
          loadHowDidYouConfig();
        }, []);

        const loadHowDidYouConfig = async () => {
          try {
            const configData = await window.storage.get('howDidYouConfig');
            if (configData) {
              setHowDidYouConfig(JSON.parse(configData.value));
            }
          } catch (error) {
            console.log('No saved howDidYou config, using defaults');
          }
        };

        const saveHowDidYouConfig = async () => {
          try {
            await window.storage.set('howDidYouConfig', JSON.stringify(howDidYouConfig));
            alert('Configuration saved successfully!');
          } catch (error) {
            console.error('Error saving config:', error);
            alert('Failed to save configuration.');
          }
        };

        const fetchSheetTabs = async () => {
          try {
            console.log('Fetching Google Sheet tabs...');
            const response = await fetch('/api/sheets/tabs');
            if (response.ok) {
              const data = await response.json();
              console.log('Sheet tabs loaded:', data.tabs);
              setAvailableTabs(data.tabs || []);
              if (!data.tabs || data.tabs.length === 0) {
                console.warn('No sheet tabs returned - check Google Sheets API connection');
              }
            } else {
              console.error('Failed to fetch tabs:', response.status);
            }
          } catch (error) {
            console.error('Error fetching sheet tabs:', error);
            setAvailableTabs([]);
          }
        };

        const startNewGame = () => {
          fetchSheetTabs(); // Refresh tabs
          setEditingGame({ id: Date.now().toString(), name: '', sheetTab: '', scheduleTab: '', gamePrefix: '', puzzles: [] });
          setGameName('');
          setSheetTab('');
          setScheduleTab('');
          setGamePrefix('');
          setPuzzles([]);
        };

        const editGame = (game) => {
          fetchSheetTabs(); // Refresh tabs
          setEditingGame(game);
          setGameName(game.name);
          setSheetTab(game.sheetTab || '');
          setScheduleTab(game.scheduleTab || '');
          setGamePrefix(game.gamePrefix || '');
          setPuzzles(game.puzzles);
        };

        const saveGame = () => {
          if (!gameName.trim()) return;

          const gameData = {
            id: editingGame.id,
            name: gameName,
            sheetTab: sheetTab,
            scheduleTab: scheduleTab,
            gamePrefix: gamePrefix,
            puzzles: puzzles
          };

          const updated = games.filter(g => g.id !== editingGame.id);
          saveGames([...updated, gameData]);
          setEditingGame(null);
        };

        const deleteGame = (id) => {
          const updated = games.filter(g => g.id !== id);
          saveGames(updated);
        };

        const addPuzzle = () => {
          if (!newPuzzleName.trim()) return;
          setPuzzles([...puzzles, { id: Date.now().toString(), name: newPuzzleName, hints: [], objects: [] }]);
          setNewPuzzleName('');
        };

        const deletePuzzle = (puzzleId) => {
          setPuzzles(puzzles.filter(p => p.id !== puzzleId));
        };

        const addHint = (puzzleId) => {
          if (!newHint.trim()) return;
          setPuzzles(puzzles.map(p =>
            p.id === puzzleId
              ? { ...p, hints: [...p.hints, { id: Date.now().toString(), text: newHint, enabled: true }] }
              : p
          ));
          setNewHint('');
          setEditingPuzzle(null);
        };

        const addObject = (puzzleId) => {
          if (!newObject.trim()) return;
          setPuzzles(puzzles.map(p =>
            p.id === puzzleId
              ? { ...p, objects: [...(p.objects || []), { id: Date.now().toString(), name: newObject, enabled: true }] }
              : p
          ));
          setNewObject('');
          setEditingObjects(null);
        };

        const toggleObject = (puzzleId, objectId) => {
          setPuzzles(puzzles.map(p =>
            p.id === puzzleId
              ? { ...p, objects: (p.objects || []).map(obj => obj.id === objectId ? { ...obj, enabled: !obj.enabled } : obj) }
              : p
          ));
        };

        const deleteObject = (puzzleId, objectId) => {
          setPuzzles(puzzles.map(p =>
            p.id === puzzleId
              ? { ...p, objects: (p.objects || []).filter(obj => obj.id !== objectId) }
              : p
          ));
        };

        // Reordering functions
        const movePuzzleUp = (index) => {
          if (index === 0) return;
          const newPuzzles = [...puzzles];
          [newPuzzles[index - 1], newPuzzles[index]] = [newPuzzles[index], newPuzzles[index - 1]];
          setPuzzles(newPuzzles);
        };

        const movePuzzleDown = (index) => {
          if (index === puzzles.length - 1) return;
          const newPuzzles = [...puzzles];
          [newPuzzles[index], newPuzzles[index + 1]] = [newPuzzles[index + 1], newPuzzles[index]];
          setPuzzles(newPuzzles);
        };

        const moveHintUp = (puzzleId, hintIndex) => {
          if (hintIndex === 0) return;
          setPuzzles(puzzles.map(p => {
            if (p.id !== puzzleId) return p;
            const newHints = [...p.hints];
            [newHints[hintIndex - 1], newHints[hintIndex]] = [newHints[hintIndex], newHints[hintIndex - 1]];
            return { ...p, hints: newHints };
          }));
        };

        const moveHintDown = (puzzleId, hintIndex) => {
          setPuzzles(puzzles.map(p => {
            if (p.id !== puzzleId) return p;
            if (hintIndex === p.hints.length - 1) return p;
            const newHints = [...p.hints];
            [newHints[hintIndex], newHints[hintIndex + 1]] = [newHints[hintIndex + 1], newHints[hintIndex]];
            return { ...p, hints: newHints };
          }));
        };

        const moveObjectUp = (puzzleId, objectIndex) => {
          if (objectIndex === 0) return;
          setPuzzles(puzzles.map(p => {
            if (p.id !== puzzleId) return p;
            const newObjects = [...(p.objects || [])];
            [newObjects[objectIndex - 1], newObjects[objectIndex]] = [newObjects[objectIndex], newObjects[objectIndex - 1]];
            return { ...p, objects: newObjects };
          }));
        };

        const moveObjectDown = (puzzleId, objectIndex) => {
          setPuzzles(puzzles.map(p => {
            if (p.id !== puzzleId) return p;
            const objects = p.objects || [];
            if (objectIndex === objects.length - 1) return p;
            const newObjects = [...objects];
            [newObjects[objectIndex], newObjects[objectIndex + 1]] = [newObjects[objectIndex + 1], newObjects[objectIndex]];
            return { ...p, objects: newObjects };
          }));
        };

        const toggleHint = (puzzleId, hintId) => {
          const puzzle = puzzles.find(p => p.id === puzzleId);
          const hint = puzzle.hints.find(h => h.id === hintId);
          
          if (hint.enabled) {
            setShowWarning({ puzzleId, hintId, message: 'Are you sure you want to disable this hint? It will be hidden from the game screen.' });
          } else {
            setPuzzles(puzzles.map(p =>
              p.id === puzzleId
                ? { ...p, hints: p.hints.map(h => h.id === hintId ? { ...h, enabled: true } : h) }
                : p
            ));
          }
        };

        const confirmDisableHint = () => {
          const { puzzleId, hintId } = showWarning;
          setPuzzles(puzzles.map(p =>
            p.id === puzzleId
              ? { ...p, hints: p.hints.map(h => h.id === hintId ? { ...h, enabled: false } : h) }
              : p
          ));
          setShowWarning(null);
        };

        if (editingGame) {
          return (
            <div className="min-h-screen bg-gradient-to-br from-black via-gray-950 to-black p-8">
              <div className="max-w-6xl mx-auto">
                <button
                  onClick={() => setEditingGame(null)}
                  className="mb-6 text-orange-200 hover:text-purple-100 flex items-center gap-2 transition-colors"
                >
                  <ChevronLeft size={20} />
                  Back to Games List
                </button>

                <h2 className="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-400 mb-8">
                  {editingGame.name || 'New Game'}
                </h2>

                <div className="bg-slate-700/80 backdrop-blur-lg rounded-2xl p-8 border border-orange-500/50 shadow-2xl mb-6">
                  <div className="grid grid-cols-2 gap-4 mb-4">
                    <div>
                      <label className="block text-orange-200 mb-2 font-semibold" title="Shown to game masters when picking a room to run in Pre-Game.">Game Name</label>
                      <input
                        type="text"
                        value={gameName}
                        onChange={(e) => setGameName(e.target.value)}
                        title="Display name for this room, e.g. 'The Dragon's Gambit'."
                        className="w-full bg-slate-600/90 text-white p-4 rounded-xl border border-orange-400/60 focus:border-orange-400 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-orange-200 mb-2 font-semibold flex items-center justify-between">
                        <span title="The tab in the shared Google Sheet that this room's sessions write to (usually named 'pi-<abbrev>').">Google Sheet Tab</span>
                        <button
                          onClick={fetchSheetTabs}
                          title="Reload the list of tabs from the connected Google Sheet."
                          className="text-xs bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded-lg transition-all"
                        >
                          Refresh Tabs
                        </button>
                      </label>
                      <select
                        value={sheetTab}
                        onChange={(e) => setSheetTab(e.target.value)}
                        title="If your tab isn't listed, click 'Refresh Tabs' or check the Google Sheets connection (docs/GOOGLE-SHEETS-SETUP.md)."
                        className="w-full bg-slate-600/90 text-white p-4 rounded-xl border border-orange-400/60 focus:border-orange-400 focus:outline-none"
                      >
                        <option value="">
                          {availableTabs.length === 0 ? '-- Loading tabs... --' : '-- Select Sheet Tab --'}
                        </option>
                        {availableTabs.map(tab => (
                          <option key={tab} value={tab}>{tab}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4 mb-6">
                    <div>

                        {editingPuzzle === puzzle.id && (

                            <textarea

                            <button

                              Save Hint
                            </button>

                        {editingObjects === puzzle.id && (
                          <div className="mb-4">
                            <input
                              type="text"
                              value={newObject}
                              onChange={(e) => setNewObject(e.target.value)}
                              onKeyPress={(e) => e.key === 'Enter' && addObject(puzzle.id)}
                              placeholder="Enter object name (e.g., 'Key', 'Hidden Letter')"
                              className="w-full bg-slate-500/90 text-white p-4 rounded-xl border border-orange-400/60 focus:border-orange-400 focus:outline-none mb-2"
                            />
                            <button
                              onClick={() => addObject(puzzle.id)}
                              className="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-500 transition-all"
                            >
                              Save Object
                            </button>
                          </div>
                        )}

                        <div className="grid grid-cols-2 gap-4">
                          <div>
                            <h5 className="text-sm font-semibold text-orange-200 mb-2">Hints</h5>
                            <div className="space-y-2">
                              {puzzle.hints.map((hint, hintIdx) => (
                                <div
                                  key={hint.id}
                                  className={`flex items-start justify-between p-3 rounded-lg ${
                                    hint.enabled
                                      ? 'bg-slate-600/30 border border-orange-500/50'
                                      : 'bg-slate-600/10 border border-slate-600/30 opacity-50'
                                  }`}
                                >
                                  <div className="flex items-start gap-2 flex-1">
                                    <div className="flex flex-col gap-1 mt-1">
                                      <button
                                        onClick={() => moveHintUp(puzzle.id, hintIdx)}
                                        disabled={hintIdx === 0}
                                        className={`p-0.5 rounded ${hintIdx === 0 ? 'text-gray-600 cursor-not-allowed' : 'text-orange-300 hover:bg-orange-600/20'} transition-all`}
                                        title="Move up"
                                      >
                                        <ChevronUp size={12} />
                                      </button>
                                      <button
                                        onClick={() => moveHintDown(puzzle.id, hintIdx)}
                                        disabled={hintIdx === puzzle.hints.length - 1}
                                        className={`p-0.5 rounded ${hintIdx === puzzle.hints.length - 1 ? 'text-gray-600 cursor-not-allowed' : 'text-orange-300 hover:bg-orange-600/20'} transition-all`}
                                        title="Move down"
                                      >
                                        <ChevronDown size={12} />
                                      </button>
                                    </div>
                                    <div className="flex-1">
                                      <span className="text-orange-300 font-mono text-sm mr-3">Hint {hintIdx + 1}:</span>
                                      <span className="text-white">{hint.text}</span>
                                      {!hint.enabled && <span className="text-red-400 ml-3 text-sm">(Disabled)</span>}
                                    </div>
                                  </div>
                                  <button
                                    onClick={() => toggleHint(puzzle.id, hint.id)}
                                    className={`px-3 py-1 rounded text-sm font-medium transition-all ${
                                      hint.enabled
                                        ? 'bg-red-600/20 text-red-400 hover:bg-red-600/30'
                                        : 'bg-green-600/20 text-green-400 hover:bg-green-600/30'
                                    }`}
                                  >
                                    {hint.enabled ? 'Disable' : 'Enable'}
                                  </button>
                                </div>
                              ))}
                              {puzzle.hints.length === 0 && (
                                <p className="text-orange-300 text-sm italic">No hints yet</p>
                              )}
                            </div>
                          </div>

                          <div>
                            <h5 className="text-sm font-semibold text-blue-200 mb-2">Objects</h5>
                            <div className="space-y-2">
                              {(puzzle.objects || []).map((obj, objIdx) => (
                                <div
                                  key={obj.id}
                                  className={`flex items-center justify-between p-3 rounded-lg ${
                                    obj.enabled
                                      ? 'bg-slate-600/30 border border-blue-400/50'
                                      : 'bg-slate-600/10 border border-slate-600/30 opacity-50'
                                  }`}
