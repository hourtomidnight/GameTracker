<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hour to Midnight - CSV Downloads</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    const Download = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
    );
    
    const Trash2 = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
    );
    
    const ChevronLeft = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    );

    const CSVDownloadsPage = () => {
      const [csvFiles, setCsvFiles] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        checkAuthAndLoadFiles();
      }, []);

      const checkAuthAndLoadFiles = async () => {
        try {
          const response = await fetch('/api/auth/check');
          const data = await response.json();
          if (data.authenticated) {
            loadFiles();
          } else {
            window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname);
          }
        } catch (error) {
          window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname);
        }
      };

      const loadFiles = async () => {
        try {
          const response = await fetch('/api/csv/list');
          if (response.status === 401) {
            window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname);
            return;
          }
          const data = await response.json();
          setCsvFiles(data.files || []);
        } catch (error) {
          console.error('Error loading CSV files:', error);
        } finally {
          setLoading(false);
        }
      };

      const handleDelete = async (filename) => {
        if (!confirm(`Are you sure you want to delete ${filename}?`)) return;
        
        try {
          const response = await fetch(`/api/csv/delete/${filename}`, {
            method: 'DELETE'
          });
          
          if (response.ok) {
            loadFiles();
          } else {
            alert('Failed to delete file');
          }
        } catch (error) {
          console.error('Error deleting file:', error);
          alert('Error deleting file');
        }
      };

      if (loading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950 flex items-center justify-center">
            <div className="text-orange-400 text-2xl">Loading...</div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950 p-8">
          <div className="max-w-4xl mx-auto">
            <button
              onClick={() => window.location.href = '/'}
              className="mb-6 text-orange-300 hover:text-orange-100 flex items-center gap-2 transition-colors"
            >
              <ChevronLeft size={20} />
              Back to Home
            </button>

            <div className="text-center mb-12">
              <div className="flex justify-center mb-6">
                <img src="https://www.hourtomidnight.com/wp-content/uploads/2025/02/57bdd921036be9b815b12c40_Logo-Horiz-White-Text.webp" alt="Hour to Midnight" className="h-20" onError={(e) => e.target.style.display='none'} />
              </div>
              <h1 className="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-400 mb-4">
                CSV Downloads
              </h1>
              <p className="text-orange-300 text-lg">Download your saved session data</p>
            </div>

            <div className="bg-slate-800/50 backdrop-blur-lg rounded-2xl p-8 border border-orange-500/20 shadow-2xl">
              {csvFiles.length === 0 ? (
                <div className="text-center py-12">
                  <p className="text-orange-300 text-xl">No CSV files saved yet</p>
                  <p className="text-gray-400 mt-2">Complete a game session to generate CSV data</p>
                </div>
              ) : (
                <div className="space-y-4">
                  {csvFiles.map(file => (
                    <div
                      key={file}
                      className="bg-slate-700/30 p-6 rounded-xl border border-orange-500/20 flex items-center justify-between hover:border-orange-400/40 transition-all"
                    >
                      <div className="flex items-center gap-4">
                        <div className="bg-orange-600/20 p-3 rounded-lg">
                          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-orange-400">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                          </svg>
                        </div>
                        <div>
                          <div className="text-white font-semibold text-lg">{file}</div>
                          <div className="text-orange-300 text-sm">CSV File</div>
                        </div>
                      </div>
                      <div className="flex gap-3">
                        <a
                          href={`/csv/${file}`}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="bg-orange-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-orange-500 transition-all flex items-center gap-2 shadow-lg"
                        >
                          <Download size={20} />
                          Download
                        </a>
                        <button
                          onClick={() => handleDelete(file)}
                          className="bg-red-600/20 text-red-400 px-4 py-3 rounded-lg hover:bg-red-600/30 transition-all"
                        >
                          <Trash2 size={20} />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<CSVDownloadsPage />, document.getElementById('root'));
  </script>
</body>
</html>
