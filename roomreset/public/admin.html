<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>RoomReset — Admin</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#dd6633" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; background: #111; color: #eee; }
    .screen { padding: 24px; max-width: 480px; margin: 0 auto; }
    input, textarea, select { width: 100%; padding: 10px; margin: 6px 0; font-size: 16px; box-sizing: border-box; }
    .step-card { border: 1px solid #444; border-radius: 8px; padding: 12px; margin: 10px 0; }
    .image-thumb { position: relative; display: inline-block; margin: 0 6px 6px 0; }
    .image-thumb img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; display: block; }
    .source-badge {
      position: absolute; bottom: 2px; left: 2px; font-size: 10px; font-weight: bold;
      padding: 1px 5px; border-radius: 4px; color: white;
    }
    .source-badge.local { background: #2a4; }
    .source-badge.drive { background: #48c; }
    .drive-picker { border: 1px solid #444; border-radius: 8px; padding: 12px; margin: 10px 0; max-height: 300px; overflow-y: auto; }
    .drive-picker .image-thumb { cursor: pointer; border: 2px solid transparent; border-radius: 6px; }
    .drive-picker .image-thumb:hover { border-color: #dd6633; }
    button { padding: 10px; font-size: 16px; border: none; border-radius: 6px; margin: 4px 0; }
    button:disabled { opacity: 0.6; }
    .primary { background: #d63; color: white; width: 100%; }
    .small { background: #333; color: #eee; }
    .error { background: #611; color: #fbb; border: 1px solid #a33; border-radius: 6px; padding: 10px; margin: 10px 0; }
    .status { color: #9c9; margin: 10px 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function AdminBuilder() {
      const [rooms, setRooms] = useState([]);
      const [slug, setSlug] = useState('');
      const [name, setName] = useState('');
      const [sheetTab, setSheetTab] = useState('');
      const [steps, setSteps] = useState([]);
      const [draftTitle, setDraftTitle] = useState('');
      const [draftInstructions, setDraftInstructions] = useState('');
      const [draftImages, setDraftImages] = useState([]);
      const [loadError, setLoadError] = useState('');
      const [error, setError] = useState('');
      const [status, setStatus] = useState('');
      const [uploading, setUploading] = useState(false);
      const [saving, setSaving] = useState(false);
      const [driveImages, setDriveImages] = useState([]);
      const [showDrivePicker, setShowDrivePicker] = useState(false);
      const [loadingDriveImages, setLoadingDriveImages] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [sheetTabs, setSheetTabs] = useState([]);
      const [operatorsTab, setOperatorsTab] = useState('');
      const [operatorsColumn, setOperatorsColumn] = useState('A');
      const [operatorsStartRow, setOperatorsStartRow] = useState(2);
      const [settingsStatus, setSettingsStatus] = useState('');
      const [savingSettings, setSavingSettings] = useState(false);
      const [testingOperators, setTestingOperators] = useState(false);
      const fileInput = useRef(null);

      useEffect(() => {
        fetch('/api/rooms')
          .then(async (resp) => {
            if (resp.status === 401) {
              window.location.href = '/';
              return { rooms: [] };
            }
            if (!resp.ok) {
              throw new Error(`Failed to load rooms (status ${resp.status})`);
            }
            return resp.json();
          })
          .then(d => setRooms(d.rooms || []))
          .catch(err => setLoadError(err.message || 'Failed to load rooms list.'));
      }, []);

      const openSettings = async () => {
        setError('');
        setSettingsStatus('');
        setShowSettings(true);
        try {
          const [settingsResp, tabsResp] = await Promise.all([
            fetch('/api/settings'),
            fetch('/api/sheet-tabs')
          ]);
          if (settingsResp.status === 401 || tabsResp.status === 401) {
            window.location.href = '/';
            return;
          }
          if (settingsResp.ok) {
            const data = await settingsResp.json();
            setOperatorsTab(data.settings.operatorsTab || '');
            setOperatorsColumn(data.settings.operatorsColumn || 'A');
            setOperatorsStartRow(data.settings.operatorsStartRow || 2);
          }
          if (tabsResp.ok) {
            const data = await tabsResp.json();
            setSheetTabs(data.tabs || []);
          }
        } catch (err) {
          setError(err.message || 'Failed to load settings.');
        }
      };

      const saveOperatorSettings = async () => {
        setSettingsStatus('');
        setSavingSettings(true);
        try {
          const resp = await fetch('/api/settings', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ operatorsTab, operatorsColumn: operatorsColumn.toUpperCase(), operatorsStartRow })
          });
          if (resp.status === 401) {
            window.location.href = '/';
            return;
          }
          if (!resp.ok) {
            const errData = await resp.json().catch(() => ({}));
            setSettingsStatus(errData.error || `Save failed (status ${resp.status}).`);
            return;
          }
          setSettingsStatus('Saved.');
        } catch (err) {
          setSettingsStatus(err.message || 'Save failed.');
        } finally {
          setSavingSettings(false);
        }
      };

      const testOperators = async () => {
        setSettingsStatus('');
        setTestingOperators(true);
        try {
          const resp = await fetch('/api/operators');
          if (!resp.ok) {
            setSettingsStatus(`Test failed (status ${resp.status}).`);
            return;
          }
          const data = await resp.json();
          setSettingsStatus(
            data.operators.length > 0
              ? `Found ${data.operators.length} operator(s): ${data.operators.join(', ')}`
              : 'No operators found — check the tab name and column.'
          );
        } catch (err) {
          setSettingsStatus(err.message || 'Test failed.');
        } finally {
          setTestingOperators(false);
        }
      };

      const loadRoom = async (s) => {
        setError('');
        setStatus('');
        if (!s) { setSlug(''); setName(''); setSheetTab(''); setSteps([]); return; }
        try {
          const resp = await fetch(`/api/rooms/${s}`);
          if (resp.status === 401) {
            window.location.href = '/';
            return;
          }
          if (!resp.ok) {
            setLoadError(`Failed to load room "${s}" (status ${resp.status}).`);
            return;
          }
          const data = await resp.json();
          setLoadError('');
          setSlug(s); setName(data.room.name); setSheetTab(data.room.sheetTab); setSteps(data.room.steps || []);
        } catch (err) {
          setLoadError(err.message || `Failed to load room "${s}".`);
        }
      };

      const capturePhoto = async (e) => {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file) return;
        if (!slug) { setError('Set the room slug (Save once first) before adding photos.'); return; }
        setError('');
        setUploading(true);
        try {
          const form = new FormData();
          form.append('image', file);
          const resp = await fetch(`/api/rooms/${slug}/image`, { method: 'POST', body: form });
          if (resp.status === 401) {
            window.location.href = '/';
            return;
          }
          if (!resp.ok) {
            let message = `Photo upload failed (status ${resp.status}).`;
            try {
              const errData = await resp.json();
              if (errData && errData.error) message = errData.error;
            } catch (_) { /* ignore body parse failure */ }
            setError(message);
            return;
          }
          const data = await resp.json();
          if (!data || !data.url) {
            setError('Photo upload succeeded but no image URL was returned.');
            return;
          }
          setDraftImages(imgs => [...imgs, { source: 'local', url: data.url }]);
        } catch (err) {
          setError(err.message || 'Photo upload failed.');
        } finally {
          setUploading(false);
        }
      };

      const openDrivePicker = async () => {
        setError('');
        setShowDrivePicker(true);
        setLoadingDriveImages(true);
        try {
          const resp = await fetch('/api/drive-images');
          if (resp.status === 401) {
            window.location.href = '/';
            return;
          }
          if (!resp.ok) throw new Error(`Failed to list Drive photos (status ${resp.status}).`);
          const data = await resp.json();
          setDriveImages(data.images || []);
        } catch (err) {
          setError(err.message || 'Failed to list Drive photos.');
          setShowDrivePicker(false);
        } finally {
          setLoadingDriveImages(false);
        }
      };

      const pickDriveImage = (img) => {
        setDraftImages(imgs => [...imgs, { source: 'drive', url: `/api/drive-image/${img.id}`, driveFileId: img.id }]);
        setShowDrivePicker(false);
      };

      const removeDraftImage = (idx) => {
        setDraftImages(imgs => imgs.filter((_, i) => i !== idx));
      };

      const addStep = () => {
        if (!draftTitle) { setError('Step title is required.'); return; }
        setError('');
        setSteps(s => [...s, { id: `step-${Date.now()}`, title: draftTitle, instructions: draftInstructions, images: draftImages }]);
        setDraftTitle(''); setDraftInstructions(''); setDraftImages([]);
      };

      const removeStep = (id) => setSteps(s => s.filter(st => st.id !== id));
      const moveStep = (idx, dir) => {
        setSteps(s => {
          const copy = [...s];
          const j = idx + dir;
          if (j < 0 || j >= copy.length) return copy;
          [copy[idx], copy[j]] = [copy[j], copy[idx]];
          return copy;
        });
      };

      const save = async () => {
        setError('');
        setStatus('');
        if (!slug || !name || !sheetTab) { setError('Slug, name, and sheet tab are required.'); return; }
        if (!/^[a-z0-9-]+$/.test(slug)) { setError('Slug must contain only lowercase letters, numbers, and hyphens.'); return; }
        setSaving(true);
        try {
          const resp = await fetch(`/api/rooms/${slug}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, sheetTab, steps })
          });
          if (resp.status === 401) {
            window.location.href = '/';
            return;
          }
          if (!resp.ok) {
            let message = `Save failed (status ${resp.status}).`;
            try {
              const errData = await resp.json();
              if (errData && errData.error) message = errData.error;
            } catch (_) { /* ignore body parse failure */ }
            setError(message);
            return;
          }
          setStatus('Room saved.');
          fetch('/api/rooms')
            .then(r => (r.ok ? r.json() : Promise.reject(new Error(`status ${r.status}`))))
            .then(d => setRooms(d.rooms || []))
            .catch(() => { /* rooms list refresh is best-effort */ });
        } catch (err) {
          setError(err.message || 'Save failed.');
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="screen">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <h1>RoomReset Admin</h1>
            <div>
              <button className="small" onClick={openSettings} style={{ width: 'auto', marginRight: 8 }}>Settings</button>
              <a href="/" style={{ color: '#dd6633' }}>Home</a>
            </div>
          </div>
          {loadError && <div className="error">{loadError}</div>}
          {error && <div className="error">{error}</div>}
          {status && <div className="status">{status}</div>}

          {showSettings && (
            <div className="drive-picker">
              <p style={{ fontWeight: 'bold' }}>
                Operator List Source
                <button className="small" style={{ float: 'right' }} onClick={() => setShowSettings(false)}>Close</button>
              </p>
              <p style={{ fontSize: 13, opacity: 0.8 }}>
                The operator dropdown reads names from a range on a tab in the shared
                spreadsheet (the tab may have other data too — only this column is read).
              </p>
              <select value={operatorsTab} onChange={e => setOperatorsTab(e.target.value)}>
                <option value="">-- Select Tab --</option>
                {sheetTabs.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
              <div style={{ display: 'flex', gap: 8 }}>
                <input placeholder="Column (e.g. B)" value={operatorsColumn}
                       onChange={e => setOperatorsColumn(e.target.value)} style={{ flex: 1 }} />
                <input type="number" min="1" placeholder="Start row" value={operatorsStartRow}
                       onChange={e => setOperatorsStartRow(e.target.value)} style={{ flex: 1 }} />
              </div>
              <button className="small" onClick={saveOperatorSettings} disabled={savingSettings}>
                {savingSettings ? 'Saving…' : 'Save'}
              </button>
              <button className="small" onClick={testOperators} disabled={testingOperators}>
                {testingOperators ? 'Testing…' : 'Test'}
              </button>
              {settingsStatus && <p style={{ fontSize: 13 }}>{settingsStatus}</p>}
            </div>
          )}

          <select onChange={e => loadRoom(e.target.value)}>
            <option value="">-- New Room --</option>
            {rooms.map(r => <option key={r.slug} value={r.slug}>{r.name}</option>)}
          </select>
          <input placeholder="Room slug (e.g. pirates-cove)" value={slug}
                 onChange={e => setSlug(e.target.value)} />
          <input placeholder="Room name" value={name} onChange={e => setName(e.target.value)} />
          <input placeholder="Sheet tab name (e.g. reset-pirates-cove)" value={sheetTab}
                 onChange={e => setSheetTab(e.target.value)} />

          <h3>Steps</h3>
          {steps.map((s, idx) => (
            <div className="step-card" key={s.id}>
              <strong>{s.title}</strong>
              <p>{s.instructions}</p>
              {(s.images || []).map((img, i) => (
                <div className="image-thumb" key={img.url || i}>
                  <img src={img.url} alt="" />
                  <span className={`source-badge ${img.source}`}>{img.source === 'drive' ? 'Drive' : 'Local'}</span>
                </div>
              ))}
              <div>
                <button className="small" onClick={() => moveStep(idx, -1)}>↑</button>
                <button className="small" onClick={() => moveStep(idx, 1)}>↓</button>
                <button className="small" onClick={() => removeStep(s.id)}>Delete</button>
              </div>
            </div>
          ))}

          <h3>Add Step</h3>
          <input placeholder="Step title" value={draftTitle} onChange={e => setDraftTitle(e.target.value)} />
          <textarea placeholder="Instructions" value={draftInstructions}
                    onChange={e => setDraftInstructions(e.target.value)} />
          <input type="file" accept="image/*" capture="environment" ref={fileInput} onChange={capturePhoto} disabled={uploading} />
          <button className="small" onClick={openDrivePicker} disabled={uploading}>Browse Drive Photos</button>
          <p>{uploading ? 'Uploading photo…' : `${draftImages.length} photo(s) attached`}</p>

          {draftImages.length > 0 && (
            <div>
              {draftImages.map((img, i) => (
                <div className="image-thumb" key={img.url}>
                  <img src={img.url} alt="" />
                  <span className={`source-badge ${img.source}`}>{img.source === 'drive' ? 'Drive' : 'Local'}</span>
                  <button className="small" style={{ width: '100%', marginTop: 2 }} onClick={() => removeDraftImage(i)}>✕</button>
                </div>
              ))}
            </div>
          )}

          {showDrivePicker && (
            <div className="drive-picker">
              <p>
                {loadingDriveImages ? 'Loading Drive photos…' : `${driveImages.length} photo(s) found in the shared folder`}
                <button className="small" style={{ float: 'right' }} onClick={() => setShowDrivePicker(false)}>Close</button>
              </p>
              {driveImages.map(img => (
                <div className="image-thumb" key={img.id} onClick={() => pickDriveImage(img)} title={img.name}>
                  <img src={`/api/drive-image/${img.id}`} alt={img.name} />
                </div>
              ))}
              {!loadingDriveImages && driveImages.length === 0 && (
                <p>No photos found. Upload photos to the shared Drive folder first, then reopen this picker.</p>
              )}
            </div>
          )}

          <button className="small" onClick={addStep}>Next (Add Step)</button>

          <button className="primary" onClick={save} disabled={saving}>{saving ? 'Saving…' : 'Save Room'}</button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminBuilder />);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
