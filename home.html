<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hour to Midnight Home</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script>
    // Storage API wrapper
    window.storage = {
      async get(key) {
        try {
          const response = await fetch(`/api/storage/${key}`);
          if (response.status === 401) {
            window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname);
            return null;
          }
          if (response.ok) {
            return await response.json();
          }
          throw new Error('Not found');
        } catch (e) {
          throw e;
        }
      },
      async set(key, value) {
        const response = await fetch(`/api/storage/${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value })
        });
        if (response.status === 401) {
          window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname);
          return null;
        }
        return await response.json();
      }
    };
  </script>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    // Simple Icons
    const Settings = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M12 1v6m0 6v6"></path>
        <path d="M17.196 3.804l-4.243 4.243m0 6.364l4.243 4.243"></path>
        <path d="M23 12h-6m-6 0H1"></path>
        <path d="M17.196 20.196l-4.243-4.243m0-6.364l-4.243-4.243"></path>
      </svg>
    );
    
    const ExternalLink = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    );
    
    const Plus = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    );
    
    const Trash2 = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
    );
    
    const LogOut = ({ size = 24, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    );

    const HomeApp = () => {
      const [isChecking, setIsChecking] = useState(true);
      const [showSettings, setShowSettings] = useState(false);
      const [links, setLinks] = useState([]);
      const [newLinkName, setNewLinkName] = useState('');
      const [newLinkUrl, setNewLinkUrl] = useState('');
      const [newLinkDescription, setNewLinkDescription] = useState('');
      const [newLinkIcon, setNewLinkIcon] = useState('');
      const [themeSettings, setThemeSettings] = useState({ preset: 'medium-contrast' });

      useEffect(() => {
        checkAuthAndLoad();
      }, []);

      const checkAuthAndLoad = async () => {
        try {
          const response = await fetch('/api/auth/check');
          const data = await response.json();
          if (data.authenticated) {
            loadData();
            loadTheme();
          } else {
            window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname);
          }
        } catch (error) {
          window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname);
        } finally {
          setIsChecking(false);
        }
      };

      const loadData = async () => {
        try {
          // Core hardcoded links that always appear
          const coreLinks = [
            { id: 'core-1', name: 'Session Tracker', url: '/escape-room', internal: true, core: true },
            { id: 'core-2', name: 'Node-RED', url: '/nodered', internal: true, core: true },
            { id: 'core-3', name: 'CSV Downloads', url: '/csv-downloads', internal: true, core: true },
            { id: 'core-4', name: 'RoomReset', url: 'http://192.168.0.127:3001/', description: 'Escape room reset checklist', icon: '🔄', internal: false, core: true }
          ];

          // Load user-added links
          const linksData = await window.storage.get('homeLinks');
          let userLinks = [];

          if (linksData) {
            try {
              const parsed = JSON.parse(linksData.value);
              // Filter out any old core links and keep only user-added ones
              userLinks = parsed.filter(link => !link.core && !['core-1', 'core-2', 'core-3', 'core-4'].includes(link.id));
            } catch (e) {
              console.error('Error parsing links:', e);
            }
          }
          
          // Combine core links with user links
          setLinks([...coreLinks, ...userLinks]);
        } catch (error) {
          console.log('Error loading data:', error);
          // On error, just show core links
          setLinks([
            { id: 'core-1', name: 'Session Tracker', url: '/escape-room', internal: true, core: true },
            { id: 'core-2', name: 'Node-RED', url: '/nodered', internal: true, core: true },
            { id: 'core-3', name: 'CSV Downloads', url: '/csv-downloads', internal: true, core: true },
            { id: 'core-4', name: 'RoomReset', url: 'http://192.168.0.127:3001/', description: 'Escape room reset checklist', icon: '🔄', internal: false, core: true }
          ]);
        }
      };

      const loadTheme = async () => {
        try {
          const themeData = await window.storage.get('themePreset');
          if (themeData) {
            setThemeSettings({ preset: themeData.value });
          }
        } catch (error) {
          console.log('No saved theme, using medium-contrast');
        }
      };

      const applyTheme = async (preset) => {
        try {
          await window.storage.set('themePreset', preset);
          alert(`Theme "${preset}" applied! Reload the tracker to see changes.`);
        } catch (error) {
          console.error('Error saving theme:', error);
          alert('Failed to save theme.');
        }
      };

      const saveLinks = async (linksData) => {
        setLinks(linksData);
        // Only save user-added links (not core links)
        const userLinks = linksData.filter(link => !link.core);
        await window.storage.set('homeLinks', JSON.stringify(userLinks));
      };

      const handleLogout = async () => {
        try {
          await fetch('/api/auth/logout', { method: 'POST' });
          window.location.href = '/login';
        } catch (error) {
          console.error('Logout failed:', error);
        }
      };

      const addLink = () => {
        if (!newLinkName.trim() || !newLinkUrl.trim()) return;

        const isInternal = newLinkUrl.startsWith('/');
        const updated = [...links, {
          id: Date.now().toString(),
          name: newLinkName,
          url: newLinkUrl,
          description: newLinkDescription.trim(),
          icon: newLinkIcon.trim(),
          internal: isInternal
        }];
        saveLinks(updated);
        setNewLinkName('');
        setNewLinkUrl('');
        setNewLinkDescription('');
        setNewLinkIcon('');
      };

      const deleteLink = (id) => {
        const updated = links.filter(l => l.id !== id);
        saveLinks(updated);
      };

      const updatePassword = async (newPassword) => {
        if (!newPassword.trim()) return;
        await window.storage.set('authPassword', newPassword);
        alert('Password updated successfully!');
      };

      if (isChecking) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950 flex items-center justify-center">
            <div className="text-orange-400 text-2xl">Loading...</div>
          </div>
        );
      }

      // Settings Screen
      if (showSettings) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950 p-8">
            <div className="max-w-4xl mx-auto">
              <div className="flex items-center justify-between mb-8">
                <h1 className="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-400">
                  Settings
                </h1>
                <button
                  onClick={() => setShowSettings(false)}
                  className="bg-slate-700 text-white px-6 py-3 rounded-xl font-bold hover:bg-slate-600 transition-all"
                >
                  Back to Home
                </button>
              </div>

              {/* Change Password */}
              <div className="bg-slate-800/50 backdrop-blur-lg rounded-2xl p-8 border border-orange-500/20 shadow-2xl mb-6">
                <h2 className="text-2xl font-bold text-white mb-4">Change Password</h2>
                <div className="flex gap-4">
                  <input
                    type="password"
                    placeholder="New password"
                    id="newPasswordInput"
                    onKeyPress={(e) => {
                      if (e.key === 'Enter') {
                        updatePassword(e.target.value);
                        e.target.value = '';
                      }
                    }}
                    className="flex-1 bg-slate-700/50 text-white p-4 rounded-xl border border-orange-500/30 focus:border-orange-400 focus:outline-none"
                  />
                  <button
                    onClick={() => {
                      const input = document.getElementById('newPasswordInput');
                      updatePassword(input.value);
                      input.value = '';
                    }}
                    className="bg-green-600 text-white px-6 py-4 rounded-xl font-bold hover:bg-green-500 transition-all"
                  >
                    Update
                  </button>
                </div>
              </div>

              {/* Theme Customization */}
              <div className="bg-slate-800/50 backdrop-blur-lg rounded-2xl p-8 border border-orange-500/20 shadow-2xl mb-6">
                <h2 className="text-2xl font-bold text-white mb-4">Theme Customization</h2>
                <p className="text-orange-200 mb-6 text-sm">
                  Choose a theme preset for better tablet visibility. Changes apply immediately to the tracker.
                </p>
                
                <div className="space-y-4">
                  {/* Theme Preset Selector */}
                  <div>
                    <label className="block text-orange-200 mb-3 font-semibold">Select Theme</label>
                    <select
                      value={themeSettings.preset || 'medium-contrast'}
                      onChange={(e) => {
                        setThemeSettings({ preset: e.target.value });
                        applyTheme(e.target.value);
                      }}
                      className="w-full bg-slate-700/50 text-white p-4 rounded-xl border border-orange-500/30 focus:border-orange-400 focus:outline-none"
                    >
                      <option value="high-contrast">🔆 High Contrast - Maximum visibility</option>
                      <option value="medium-contrast">⚖️ Medium Contrast - Balanced (Current)</option>
                      <option value="low-contrast">🌙 Low Contrast - Softer on eyes</option>
                      <option value="ultra-bright">☀️ Ultra Bright - For bright rooms</option>
                    </select>
                  </div>

                  {/* Theme Preview Boxes */}
                  <div className="grid grid-cols-2 gap-4 mt-6">
                    <div className="bg-slate-700/50 p-4 rounded-xl border border-orange-500/30">
                      <div className="text-white font-semibold mb-2">Preview</div>
                      <div className="text-orange-200 text-sm">Theme will apply to tracker immediately</div>
                    </div>
                    <div className="bg-slate-700/50 p-4 rounded-xl border border-orange-500/30">
                      <div className="text-white font-semibold mb-2">Tips</div>
                      <div className="text-orange-200 text-sm">Test themes on your tablets to find the best visibility</div>
                    </div>
                  </div>
                </div>
              </div>

              {/* Manage Links */}
              <div className="bg-slate-800/50 backdrop-blur-lg rounded-2xl p-8 border border-orange-500/20 shadow-2xl">
                <h2 className="text-2xl font-bold text-white mb-6">Manage Links</h2>
                
                <div className="mb-6">
                  <div className="grid grid-cols-2 gap-4 mb-4">
                    <input
                      type="text"
                      value={newLinkName}
                      onChange={(e) => setNewLinkName(e.target.value)}
                      placeholder="Link name (e.g., 'Google')"
                      className="bg-slate-700/50 text-white p-4 rounded-xl border border-orange-500/30 focus:border-orange-400 focus:outline-none"
                    />
                    <input
                      type="text"
                      value={newLinkUrl}
                      onChange={(e) => setNewLinkUrl(e.target.value)}
                      placeholder="URL (e.g., 'https://google.com' or '/escape-room')"
                      className="bg-slate-700/50 text-white p-4 rounded-xl border border-orange-500/30 focus:border-orange-400 focus:outline-none"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-4 mb-4">
                    <input
                      type="text"
                      value={newLinkDescription}
                      onChange={(e) => setNewLinkDescription(e.target.value)}
                      placeholder="Description (optional, e.g., 'Weekly schedule form')"
                      className="bg-slate-700/50 text-white p-4 rounded-xl border border-orange-500/30 focus:border-orange-400 focus:outline-none"
                    />
                    <input
                      type="text"
                      value={newLinkIcon}
                      onChange={(e) => setNewLinkIcon(e.target.value)}
                      placeholder="Icon/emoji (optional, e.g., '📋')"
                      maxLength={4}
                      className="bg-slate-700/50 text-white p-4 rounded-xl border border-orange-500/30 focus:border-orange-400 focus:outline-none"
                    />
                  </div>
                  <button
                    onClick={addLink}
                    className="w-full bg-gradient-to-r from-orange-600 to-amber-600 text-white p-4 rounded-xl font-bold flex items-center justify-center gap-2 hover:from-orange-500 hover:to-amber-500 transition-all shadow-lg"
                  >
                    <Plus size={20} />
                    Add Link
                  </button>
                </div>

                <div className="space-y-3">
                  {links.map(link => (
                    <div
                      key={link.id}
                      className="bg-slate-700/30 p-4 rounded-xl border border-orange-500/20 flex items-center justify-between"
                    >
                      <div>
                        <div className="text-white font-semibold">{link.icon && <span className="mr-2">{link.icon}</span>}{link.name}</div>
                        <div className="text-orange-300 text-sm">{link.url}</div>
                        {link.description && <div className="text-orange-200 text-xs mt-1 italic">{link.description}</div>}
                        <div className="text-orange-400 text-xs mt-1">
                          {link.core ? 'Built-in Link' : (link.internal ? 'Internal Link' : 'External Link')}
                        </div>
                      </div>
                      {!link.core && (
                        <button
                          onClick={() => deleteLink(link.id)}
                          className="px-4 py-2 bg-red-600/20 text-red-400 rounded-lg hover:bg-red-600/30 transition-all"
                        >
                          <Trash2 size={18} />
                        </button>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      }

      // Home Screen
      return (
        <div className="min-h-screen bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950 p-8">
          <div className="max-w-6xl mx-auto">
            <div className="flex items-center justify-between mb-12">
              <div className="flex flex-col">
                <img src="https://www.hourtomidnight.com/wp-content/uploads/2025/02/57bdd921036be9b815b12c40_Logo-Horiz-White-Text.webp" alt="Hour to Midnight" className="h-16 mb-4" onError={(e) => e.target.style.display='none'} />
                <h1 className="text-4xl font-bold text-orange-400">
                  Home
                </h1>
              </div>
              <div className="flex gap-4">
                <button
                  onClick={() => setShowSettings(true)}
                  className="bg-slate-800/50 backdrop-blur-lg p-4 rounded-xl border border-orange-500/20 hover:border-orange-400/50 transition-all shadow-xl text-white flex items-center gap-2"
                >
                  <Settings size={24} />
                  <span className="font-bold">Settings</span>
                </button>
                <button
                  onClick={handleLogout}
                  className="bg-slate-800/50 backdrop-blur-lg p-4 rounded-xl border border-red-500/20 hover:border-red-400/50 transition-all shadow-xl text-white flex items-center gap-2"
                >
                  <LogOut size={24} />
                  <span className="font-bold">Logout</span>
                </button>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {links.map(link => {
                // Get favicon URL for external links (used only when no custom icon is set)
                const faviconUrl = link.icon || link.internal
                  ? null
                  : `https://www.google.com/s2/favicons?domain=${link.url}&sz=64`;

                return (
                  <a
                    key={link.id}
                    href={link.url}
                    target={link.internal ? '_self' : '_blank'}
                    rel={link.internal ? '' : 'noopener noreferrer'}
                    className="bg-slate-800/50 backdrop-blur-lg p-8 rounded-2xl border border-orange-500/20 hover:border-orange-400/50 transition-all shadow-xl group"
                  >
                    <div className="flex items-center gap-4 mb-4">
                      {link.icon && (
                        <div className="w-12 h-12 rounded-lg bg-white/10 flex items-center justify-center text-2xl">
                          {link.icon}
                        </div>
                      )}
                      {faviconUrl && (
                        <img
                          src={faviconUrl}
                          alt=""
                          className="w-12 h-12 rounded-lg bg-white/10 p-2"
                          onError={(e) => e.target.style.display='none'}
                        />
                      )}
                      <div className="flex-1">
                        <h2 className="text-2xl font-bold text-white group-hover:text-orange-400 transition-colors">
                          {link.name}
                        </h2>
                        {link.description && (
                          <p className="text-orange-200 text-sm mt-1">{link.description}</p>
                        )}
                      </div>
                      {!link.internal && <ExternalLink size={20} className="text-orange-400/60" />}
                    </div>
                  </a>
                );
              })}
            </div>

            {links.length === 0 && (
              <div className="text-center text-orange-300 mt-12">
                <p className="text-xl">No links configured yet.</p>
                <p className="text-sm mt-2">Click Settings to add your first link!</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.render(<HomeApp />, document.getElementById('root'));
  </script>
</body>
</html>
